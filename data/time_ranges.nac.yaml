fmc:
  domains:
  - name: Global
    objects:
      time_ranges:
      - name: time_range_1
        recurrences:
        - recurrence_type: DAILY_INTERVAL
          daily_days:
          - WED
          - THU
          daily_start_time: 08:00
          daily_end_time: '17:00'
      - name: time_range_2
        recurrences:
        - recurrence_type: RANGE
          range_start_day: TUE
          range_start_time: 03:00
          range_end_day: SUN
          range_end_time: '12:30'
      - name: time_range_3
        recurrences:
        - recurrence_type: RANGE
          range_start_day: THU
          range_start_time: 06:00
          range_end_day: SAT
          range_end_time: 00:00
